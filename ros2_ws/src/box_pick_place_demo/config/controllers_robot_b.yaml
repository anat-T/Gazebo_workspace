# Same structure as controllers_robot_a.yaml, prefixed for robot_b instead.
robot_b_controller_manager:
  ros__parameters:
    update_rate: 100 # Hz
    use_sim_time: true

    robot_b_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot_b_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

robot_b_joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot_b_shoulder_pan_joint
      - robot_b_shoulder_lift_joint
      - robot_b_elbow_joint
      - robot_b_wrist_1_joint
      - robot_b_wrist_2_joint
      - robot_b_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
